# -----------------------------------------------------------------------
# configs/Derexyl/PatientSpecificXemaPred/t_horizon_1/derexyl_swelling_orderedrw.yaml
# -----------------------------------------------------------------------

# Dataset and target -----------------------------------------------------

dataset: "Derexyl"          # Derexyl | PFDC | Fake
score: "swelling"           # extent | dryness | redness | swelling | oozing | thickening | scratching | itching | sleep
model: "OrderedRW"          # BinMC | OrderedRW | BinRW

# Forward-chaining setup -------------------------------------------------

t_horizon: 1                # Forecast/update horizon

# Particle-filter settings -----------------------------------------------

n_particles: 4000           # Number of PF particles per patient
ess_frac: 0.5               # ESS threshold for resampling, as a fraction of particles

# Parallelisation --------------------------------------------------------

n_cluster: 4                # Number of foreach workers / patients run in parallel

# Run mode ---------------------------------------------------------------

run: true                   # If false, only checks config and prepares paths

# PMMH rejuvenation settings ---------------------------------------------

pmmh_window_n: 20           # Number of consecutive time steps used in each PMMH update

# -----------------------------------------------------------------------
# Held-out within-cohort 2-fold ROBUST MIXTURE-prior experiment
#
# Population prior:
#   Derexyl Fold 2
#
# Patient-specific target:
#   Derexyl Fold 1
#
# Cross-fitting direction:
#   Fold 2 population prior -> Fold 1 patients
#
# Mixture prior:
#   p(theta) = (1-w) p_base(theta) + w p_population(theta)
#   w = 1.00
#
# Target and source folds MUST differ to avoid patient leakage.
# -----------------------------------------------------------------------

n_patient_folds: 2
patient_fold: 1

# -----------------------------------------------------------------------
# Population-informed robust mixture prior
# -----------------------------------------------------------------------

prior_mode: population
prior_combination: mixture

# In mixture mode prior_power is the population mixture weight w.
prior_power: 1.00

prior_root: "priors/population_xemapred_2fold"

# Same cohort, but strictly held-out source fold.
prior_source_dataset: "Derexyl"
prior_source_fold: 2
allow_same_dataset_prior: true

# Exact held-out fold-specific population posterior.
population_prior_file: "priors/population_xemapred_2fold/Derexyl/fold_2/swelling.rds"

# Keep the same mixture prior during PMMH rejuvenation.
pmmh_prior_mode: matched

# Unique output/cache directory for this mixture weight and fold direction.
run_suffix: "PopPrior-fold-1"
