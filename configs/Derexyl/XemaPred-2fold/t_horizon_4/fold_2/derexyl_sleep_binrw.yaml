# -----------------------------------------------------------------------
# configs/Derexyl/XemaPred/t_horizon_4/derexyl_sleep_binrw.yaml
# -----------------------------------------------------------------------

# Dataset and target -----------------------------------------------------

dataset: "Derexyl"          # Derexyl | PFDC | Fake
score: "sleep"              # extent | dryness | redness | swelling | oozing | thickening | scratching | itching | sleep
model: "BinRW"              # BinMC | OrderedRW | BinRW

# Forward-chaining setup -------------------------------------------------

t_horizon: 4                # Forecast/update horizon

# Particle-filter settings -----------------------------------------------

n_particles: 4000           # Number of particles for PF runs

# Parallelisation --------------------------------------------------------

n_cluster: 16               # Number of foreach workers / iterations run in parallel

# Run mode ---------------------------------------------------------------

run: true                   # If false, only checks config and prepares paths
cohort: true                # If true, use the cohort/population-level XemaPred workflow
smc2: true                  # If true, use SMC² with parameter particles and inner PFs

# SMC² settings ----------------------------------------------------------

n_theta: 195                # Number of parameter particles (at 200 it blocks so changed it to 195)
n_x: 195                    # Number of inner state particles per parameter particle (at 200 it blocks so changed it to 195)

ess_theta: 0.5              # ESS threshold for parameter-particle resampling
ess_x: 0.5                  # ESS threshold for inner state-particle resampling

# PMMH rejuvenation settings ---------------------------------------------

pmmh_window_n: 10           # PMMH window size; use Inf for all available data

# Patient-fold source population ----------------------------------------
n_patient_folds: 2
patient_fold: 2

# Keep fold outputs separate --------------------------------------------
run_suffix: "PriorSourceFold2"
