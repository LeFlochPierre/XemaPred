# -----------------------------------------------------------------------
# configs/PFDC/reference_models/historical/t_horizon_4/pfdc_redness_historical.yaml
# -----------------------------------------------------------------------

# Dataset and target -----------------------------------------------------

dataset: "PFDC"             # PFDC | PFDC | Fake
score: "redness"            # POSCORAD item to model
model: "historical"         # Reference model: uniform | historical | RW | MC

# Forward-chaining setup -------------------------------------------------

t_horizon: 4                # Forecast/update horizon used by get_fc_iteration()

# MCMC settings ----------------------------------------------------------
# Not used by the historical model, but kept for compatibility with the
# shared config parser.

n_chains: 4                 # Ignored by historical model
n_iter: 2000                # Ignored by historical model

# Parallelisation --------------------------------------------------------

n_cluster: 4                # Number of foreach workers / iterations run in parallel

# Run mode ---------------------------------------------------------------

run: true                   # If false, only checks config and prepares paths
