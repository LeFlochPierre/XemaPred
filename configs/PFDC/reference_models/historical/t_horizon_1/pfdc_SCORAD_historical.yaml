# -----------------------------------------------------------------------
# configs/PFDC/reference_models/historical/t_horizon_1/pfdc_SCORAD_historical.yaml
# -----------------------------------------------------------------------

# Dataset and target -----------------------------------------------------

dataset: "PFDC"             # Derexyl | PFDC | Fake
score: "SCORAD"             # Total PO-SCORAD score
model: "historical"         # SCORAD reference model

# Forward-chaining setup -------------------------------------------------

t_horizon: 1                # Forecast/update horizon used by get_fc_iteration()

# MCMC settings ----------------------------------------------------------
# Note: uniform and historical do not fit a Stan model, but the runner still
# checks these fields, so they are kept for consistency.

n_chains: 4                 # Number of Stan chains per fitted reference model
n_iter: 2000                # Number of MCMC iterations per chain

# Parallelisation --------------------------------------------------------

n_cluster: 4                # Number of foreach workers / iterations run in parallel

# Run mode ---------------------------------------------------------------

run: true                   # If false, only checks config and prepares paths
