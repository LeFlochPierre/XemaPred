# -----------------------------------------------------------------------
# configs/PFDC/reference_models/MixedAR1/t_horizon_1/pfdc_SCORAD_MixedAR1.yaml
#
# Notes:
# - The MixedAR1 reference model is used for SCORAD only.
# -----------------------------------------------------------------------

# Dataset and target -----------------------------------------------------

dataset: "PFDC"             # PFDC | PFDC | Fake
score: "SCORAD"             # Total PO-SCORAD score
model: "MixedAR1"           # Mixed AR(1) reference model

# Forward-chaining setup -------------------------------------------------

t_horizon: 1                # Forecast/update horizon used by get_fc_iteration()

# MCMC settings ----------------------------------------------------------

n_chains: 4                 # Number of Stan chains per MixedAR1 fit
n_iter: 2000                # Number of MCMC iterations per chain

# Parallelisation --------------------------------------------------------

n_cluster: 4                # Number of foreach workers / iterations run in parallel

# Run mode ---------------------------------------------------------------

run: true                   # If false, only checks config and prepares paths
